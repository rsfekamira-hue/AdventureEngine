[workspace]
members = ["crates/core", "crates/render-contract", "crates/renderer", "crates/renderer-2d", "crates/debug-tools", "crates/debug-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
engine-core = { path = "crates/core" }
engine-debug-tools = { path = "crates/debug-tools" }
render-contract = { path = "crates/render-contract" }
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "webgpu", "dx12"] }

[profile.release]
opt-level = "s"
lto = true
