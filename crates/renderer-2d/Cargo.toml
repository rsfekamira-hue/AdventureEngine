[package]
name = "engine-renderer-2d"
version.workspace = true
edition.workspace = true

[dependencies]
egui = { version = "=0.31.1", default-features = false }

engine-image-resources = { path = "../image-resources" }
wgpu = { workspace = true, optional = true }
egui-wgpu = { version = "=0.31.1", default-features = false, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
gpu = ["dep:wgpu", "dep:egui-wgpu", "dep:bytemuck"]

[dev-dependencies]
engine-capture = { path = "../capture" }
image = { version = "=0.25.5", default-features = false, features = ["png"] }
